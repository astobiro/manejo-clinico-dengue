<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Medical Cross Shield Background -->
  <g filter="url(#shadow)">
    <!-- White Medical Cross -->
    <path d="M 220 100 L 292 100 A 12 12 0 0 1 304 112 L 304 220 L 412 220 A 12 12 0 0 1 424 232 L 424 304 A 12 12 0 0 1 412 316 L 304 316 L 304 424 A 12 12 0 0 1 292 436 L 220 436 A 12 12 0 0 1 208 424 L 208 316 L 100 316 A 12 12 0 0 1 88 304 L 88 232 A 12 12 0 0 1 100 220 L 208 220 L 208 112 A 12 12 0 0 1 220 100 Z" fill="#FFFFFF" />
  </g>

  <!-- Center Heartbeat / Pulse / Drop in Blue -->
  <!-- Hydration drop in center of the cross -->
  <path d="M 256 180 C 256 180 206 244 206 280 C 206 307.6 228.4 330 256 330 C 283.6 330 306 307.6 306 280 C 306 244 256 180 256 180 Z" fill="#2563EB" />
  
  <!-- Inner glistening highlight in drop -->
  <ellipse cx="244" cy="272" rx="12" ry="20" transform="rotate(-30 244 272)" fill="rgba(255,255,255,0.4)" />

  <!-- Stethoscope / Mosquito minimal accent line -->
  <circle cx="256" cy="284" r="8" fill="#FFFFFF" />
</svg>